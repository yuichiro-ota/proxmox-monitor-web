services:
  back:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: proxmox-back
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
      - ONPREM_CONFIG=/app/config/hosts.toml
    volumes:
      # オンプレ監視の設定フォルダ（編集可能）。
      # config/hosts.toml.example をコピーして config/hosts.toml を作成する。
      - ./config:/app/config

  front:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: proxmox-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - back
